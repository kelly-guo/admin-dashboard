<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class = "container">
        <div class="header">
            <div class="search">searchbar</div>
            <div class="pfp">image</div>
            <div class="greet">Hi there, <h2>First Name Last Name</h2></div>
            <button class="header-button" id="new">New</button>
            <button class="header-button" id="upload">Upload</button>
            <button class="header-button" id="share">Share</button>

        </div>
        <div class = "sidebar">
            <h2 class="dash-header">Dashboard</h2>
            <nav class="sidebar-nav">
                <div>Home</div>
                <div>Profile</div>
                <div>Messages</div>
                <div>History</div>
                <div>Tasks</div>
                <div>Communtities</div>
                <div class="side-spacer"></div>
                <div>Settings</div>
                <div>Support</div>
                <div>Privacy</div>
            </nav>
            
        </div>
        <div class="main-content">
            <h3 class="projects">Your projects</h3>
            <div class="project-card">Project 1</div>
            <div class="project-card">Project 2</div>
            <div class="project-card">Project 3</div>
            <div class="project-card">Project 4</div>
            <div class="project-card">Project 5</div>
            <div class="project-card">Project 6</div>

            <h3 class="announcements">Announcements</h3>

            <h3 class="trending">Trending</h3>
        </div>
        
    </div>
    
</body>
</html>
